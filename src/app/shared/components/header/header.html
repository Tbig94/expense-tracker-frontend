<header class="main-header">
  <h4>{{ title() }}</h4>
  @if (authService.isLoggedIn()) {
    <div class="header-right">
      <h4 id="userEmail">{{ authService.currentUser()?.email }}</h4>
      <button matButton="outlined" type="button" (click)="onLogout()">
        <mat-icon>logout</mat-icon>Sign out
      </button>
    </div>
  }
</header>
