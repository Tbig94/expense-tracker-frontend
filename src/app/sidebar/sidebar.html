@if (authService.isLoggedIn()) {
  <nav class="sidebar">
    <a class="brand" routerLink="/dashboard"> Expense Tracker </a>

    <mat-divider></mat-divider>

    <mat-nav-list class="main-nav">
      <a
        mat-list-item
        routerLink="/dashboard"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        <span class="navbar-dot dot1"></span>
        <span>Dashboard</span>
      </a>

      <a mat-list-item routerLink="/expenses" routerLinkActive="active">
        <span class="navbar-dot dot2"></span>
        <span>Expenses</span>
      </a>

      <a mat-list-item routerLink="/categories" routerLinkActive="active">
        <span class="navbar-dot dot3"></span>
        <span>Categories</span>
      </a>

      <a mat-list-item routerLink="/budgets" routerLinkActive="active">
        <span class="navbar-dot dot4"></span>
        <span>Budgets</span>
      </a>

      <a mat-list-item routerLink="/statistics" routerLinkActive="active">
        <span class="navbar-dot dot5"></span>
        <span>Statistics (WIP)</span>
      </a>
    </mat-nav-list>

    <mat-nav-list class="bottom-nav">
      <a mat-list-item routerLink="/account" routerLinkActive="active">
        <span class="navbar-dot dot6"></span>
        <span>Account</span>
      </a>
    </mat-nav-list>
  </nav>
}
