@if (categoryItem(); as category) {
  <div class="categoryCard">
    <div class="card-left">
      <span class="category-dot" [style.background-color]="category.color"></span>
      {{ category.name }}
    </div>
    <div class="card-right">
      @if (!isSystemCategory()) {
        <button id="deleteButton" class="btn btn-danger" (click)="deleteCategory(category.id)">
          X
        </button>
      }
    </div>
  </div>
}
