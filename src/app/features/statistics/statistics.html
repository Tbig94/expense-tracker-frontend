<div class="statisticsPage">
  <div class="monthlyStats">
    <div class="d-flex flex-row" id="buttons">
      <button matButton="filled" type="button" (click)="switch('monthly')">Monthly</button>
      <button matButton="filled" type="button" (click)="switch('yearly')">Yearly</button>
    </div>
    @if (isMonthly()) {
      <app-monthly-statistics></app-monthly-statistics>
    } @else {
      <app-yearly-statistics></app-yearly-statistics>
    }
  </div>
</div>
