<form [formGroup]="form">
  <mat-form-field appearance="fill">
    <mat-label>Month</mat-label>
    <mat-select formControlName="month" placeholder="Choose a month">
      @for (item of months; track item) {
        <mat-option [value]="item">{{ item }}</mat-option>
      }
    </mat-select>
  </mat-form-field>
</form>
<app-monthly-small-cards [monthlyStats]="monthlyStats"></app-monthly-small-cards>
<mat-divider></mat-divider>
<app-monthly-large-cards [monthlyStats]="monthlyStats"></app-monthly-large-cards>
