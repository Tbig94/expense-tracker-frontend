<div class="dialog-window">
  <div class="dialog-header">
    <h2>Delete Account</h2>
  </div>
  <br />
  <div class="dialog-content">Are you sure you want to delete your account?</div>
  <div class="dialog-footer d-flex">
    <button matButton="outlined" (click)="cancel()">Cancel</button>
    <button matButton="filled" (click)="delete()"><mat-icon>delete</mat-icon>Delete</button>
  </div>
</div>
