<div class="accountPage d-flex flex-columns">
  <div class="personalInfoCard">
    <h3>Personal Information</h3>
    <div class="accountInfoMain">
      <h5>Name</h5>
      <h4>{{ account!.name }}</h4>
      <br />
      <br />
      <h5>Email</h5>
      <h4>{{ account!.email }}</h4>
    </div>
  </div>
  <div class="accountActionsCard">
    <h3>Account Actions</h3>
    <div class="deleteAccountCard">
      <h4>Delete Account</h4>
      <button matButton="filled" (click)="openDeleteDialog()">
        <mat-icon>delete</mat-icon>Delete
      </button>
    </div>
  </div>
</div>
