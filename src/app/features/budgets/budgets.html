<div class="content-page">
  <div id="budgetsTop">
    <div id="budgetsTopLeft">
      <h5>Your budgets for the current month.</h5>
    </div>

    <div id="budgetsTopRight">
      <p>
        <button matButton="filled" id="newButton" (click)="openCreateDialog()">
          <mat-icon>add</mat-icon>New budget
        </button>
      </p>
    </div>
  </div>

  @if (budgets.length > 0) {
    <div id="budgetCards">
      @for (item of budgets; track item.id) {
        <app-budget-card
          [budgetItem]="item"
          (onDelete)="handleDeleteBudget($event)"
        ></app-budget-card>
      }
    </div>
  }
</div>
