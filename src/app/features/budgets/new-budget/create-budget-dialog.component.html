<div class="dialog-window">
  <div class="dialog-header">
    <h2>New budget</h2>
  </div>
  <br />
  <div class="dialog-content">
    <form [formGroup]="createBudgetForm" (ngSubmit)="create()" class="d-flex flex-column">
      <mat-form-field>
        <mat-label>Limit</mat-label>
        <input
          matInput
          id="amount"
          type="number"
          placeholder="Limit of the budget"
          formControlName="amount"
          min="0"
        />
      </mat-form-field>

      <mat-form-field appearance="fill">
        <mat-label>Category</mat-label>
        <mat-select formControlName="categoryName" placeholder="Choose a category">
          @for (category of categories; track category.id) {
            <mat-option [value]="category.name">{{ category.name }}</mat-option>
          }
        </mat-select>
      </mat-form-field>

      <div class="dialog-footer d-flex flex-rows">
        <button matButton="outlined" type="button" (click)="cancel()">Cancel</button>
        <button matButton="filled" (click)="create()">Ok</button>
      </div>
    </form>
  </div>
</div>
