<div id="budget-card">
  @if (budgetItem()) {
    <div class="cardInfo">
      <span>
        <b> {{ budgetItem()?.categoryName }}</b>
      </span>
      <span>{{ budgetItem()?.limitAmount | currency: 'Ft' : 'symbol' : '1.0-0' }}</span>
      <span>
        {{ budgetItem()?.validFrom | date: 'yyyy.MM.dd' }} -
        {{ budgetItem()?.validTo | date: 'yyyy.MM.dd' }}
      </span>
    </div>
    <div class="removeButton">
      <button mat-mini-fab color="warn" (click)="deleteBudget(budgetItem()!.id)">
        <mat-icon>delete</mat-icon>
      </button>
    </div>
  }
</div>
