<div class="d-flex flex-columns" id="budget-card">
  @if (budgetItem(); as budget) {
    <div class="cardInfo d-flex">
      <div class="">
        <p>Limit: {{ budgetItem()?.limitAmount }}</p>
        <p>Category: {{ categoryName() }}</p>
        <p>Month: {{ budgetItem()?.year }}-{{ budgetItem()?.month }}</p>
      </div>
    </div>
    <div class="removeButton d-flex">
      <button class="btn btn-danger" (click)="deleteBudget(budget.id)">X</button>
    </div>
  }
</div>
